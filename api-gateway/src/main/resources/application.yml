server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200,http://localhost:5173"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: organization-service
          uri: http://localhost:8082
          predicates:
            - Path=/organizations/**

        - id: billing-service
          uri: http://localhost:8083
          predicates:
            - Path=/billing/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/notifications/**

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
