server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # a slow or dead Redis must not hold requests: the rate limit lets them through (REQ-SCALE-02)
      timeout: 500ms
      connect-timeout: 1s
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200,http://localhost:5173"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        - id: organization-service
          uri: ${ORG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/organizations/**,/invitations/**

        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/billing/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/notifications/**

# Rate limiting (P10.2, REQ-SCALE-02): per user, plus an aggregate per tenant that grows with its active users.
# Defaults, not requirements (section 4 of the plan).
saas:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    user-per-second: ${RATE_LIMIT_USER_PER_SECOND:10}
    tenant-per-active-user-per-second: ${RATE_LIMIT_TENANT_PER_ACTIVE_USER_PER_SECOND:5}
    active-window: ${RATE_LIMIT_ACTIVE_WINDOW:PT5M}
    redis-timeout: ${RATE_LIMIT_REDIS_TIMEOUT:PT0.2S}

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
