spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: organization-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/saas_shard_1
    username: ${ORG_DB_USER:org_svc}
    password: ${ORG_DB_PASSWORD}
  servlet:
    multipart:
      # the same limit the service enforces itself (saas.logo.max-bytes): the container refuses a bigger upload
      # before it is buffered, and the service re-checks, so neither layer is the only guard (REQ-PERS-03)
      max-file-size: ${LOGO_MAX_BYTES:2097152}B
      max-request-size: ${LOGO_MAX_BYTES:2097152}B
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # with OSIV (Boot's default), Hibernate opens the session - and resolves the current tenant -
    # before TenantContext is set for the request, pinning every write to the NO_TENANT sentinel (P4.1)
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: org
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: org-service
      # The outbox relay always publishes with a KafkaTemplate<String,String> forced onto
      # StringSerializer (OutboxAutoConfiguration/OutboxRelay), regardless of what a producer config
      # here might say - so the wire format is always raw JSON text, never typed with headers.
      # SubscriptionChangedListener deserializes it manually with an ObjectMapper.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # a slow or dead Redis must cost milliseconds, not a stuck request: the cache falls back to the database
      timeout: 500ms
      connect-timeout: 1s

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Tenant-scoped service: tenant_id filter + SET LOCAL app.tenant_id per transaction (P2.2)
saas:
  tenancy:
    enabled: true
  # Outbox writer (this service's role) + relay (dedicated outbox_relay role, bypasses RLS) - P3.2
  outbox:
    enabled: true
    # dormant by default (its datasource.url below only resolves for a real deployment, not
    # @ServiceConnection-based tests); enabled per-environment once this service publishes events
    relay:
      enabled: false
      schema: org
      poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
      datasource:
        url: ${spring.datasource.url}
        username: ${OUTBOX_RELAY_DB_USER:outbox_relay}
        password: ${OUTBOX_RELAY_DB_PASSWORD}
  # Internal "memberships for a user, across every tenant" lookup used synchronously by auth (P4.1,
  # REQ-EVT-09); dedicated BYPASSRLS reader, SELECT-only on org.memberships.
  org:
    auth-reader:
      datasource:
        url: ${spring.datasource.url}
        username: ${ORG_AUTH_READER_DB_USER:org_auth_reader}
        password: ${ORG_AUTH_READER_DB_PASSWORD}
    # Palette catalog in the global database (P8.1, REQ-PERS-02): same role/password as the primary
    # datasource, different database; SELECT only (the catalog belongs to auth-service).
    global-catalog:
      datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/saas_global
        username: ${ORG_DB_USER:org_svc}
        password: ${ORG_DB_PASSWORD}
  # Logo limits (P8.2, REQ-PERS-03): 2 MB and 1024x1024 px by default
  logo:
    max-bytes: ${LOGO_MAX_BYTES:2097152}
    max-width: ${LOGO_MAX_WIDTH:1024}
    max-height: ${LOGO_MAX_HEIGHT:1024}
  # Object storage behind the ObjectStorage interface: local directory now, replaceable by an external provider
  storage:
    local:
      root: ${OBJECT_STORAGE_LOCAL_ROOT:./data/object-storage}
  # Feature flags the platform knows (P8.3, REQ-PERS-07): comma-separated names; a new flag is a new name here,
  # never a migration. Every flag is disabled for every tenant until a platform operator switches it on.
  feature-flags:
    known: ${FEATURE_FLAGS_KNOWN:}
  # Palette every new tenant starts with (P8.1, REQ-PERS-05); must exist in global.palettes
  theme:
    default-palette-id: ${DEFAULT_PALETTE_ID:default}
  # Response deadline before an admin-demotion request escalates to support (P4.3, REQ-ROLE-04)
  admin-demotion:
    response-deadline: ${ADMIN_DEMOTION_RESPONSE_DEADLINE:7d}
  # Platform default for invitation expiry (P7.1, REQ-INV-01), overridable per tenant via
  # tenants.invitation_expiry_days (PATCH /organizations/{tenantId}/invitation-expiry)
  invitation:
    default-expiry-days: ${INVITATION_DEFAULT_EXPIRY_DAYS:7}
  # Redis cache (P10.1, REQ-SCALE-01): theme, member roles and the subscription's write-access status. Entries are removed
  # by the code or event that changes them and also expire on their own; the TTLs are defaults, not requirements.
  cache:
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:PT5M}
    access-status-ttl: ${CACHE_ACCESS_STATUS_TTL:PT1M}

# Synchronous write-access check (P6.4, REQ-BILL-04): if unreachable, fails open to ACTIVE so a
# billing-service outage does not lock out the rest of the platform.
billing-service:
  base-url: ${BILLING_SERVICE_BASE_URL:http://localhost:8083}
