spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/saas_global
    username: ${AUTH_DB_USER:auth_svc}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth,global
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 86400000
  refresh-token-expiry-ms: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Global, no tenancy block: outbox writer (auth_svc role) + relay (dedicated outbox_relay role) - P3.2
saas:
  outbox:
    enabled: true
    relay:
      enabled: false
      schema: auth
      poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
      datasource:
        url: ${spring.datasource.url}
        username: ${OUTBOX_RELAY_DB_USER:outbox_relay}
        password: ${OUTBOX_RELAY_DB_PASSWORD}
  # Multi-tenant login (P5.2): opaque, single-use loginSessionId lifetime (REQ-AUTH-02)
  login-session:
    ttl: ${LOGIN_SESSION_TTL:5m}

# Synchronous, uncached call for a user's tenants/roles at login (REQ-EVT-09, REQ-SCALE-01)
org-service:
  base-url: ${ORG_SERVICE_BASE_URL:http://localhost:8082}

logging:
  pattern:
    console: '{"timestamp":"%d","level":"%p","service":"auth-service","correlationId":"%X{correlationId}","message":"%m"}%n'
