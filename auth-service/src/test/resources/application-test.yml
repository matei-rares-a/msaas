# Test Configuration for Spring Boot Integration Tests
# This profile is used when @ActiveProfiles("test") is applied

# PostgreSQL Test Database
spring.datasource.url=jdbc:postgresql://localhost:5432/saas_test
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka Test Configuration (Embedded)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-consumer

# RabbitMQ Test Configuration (Embedded)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Redis Test Configuration
spring.redis.host=localhost
spring.redis.port=6379

# Security
security.jwt.secret=test-secret-key-for-unit-tests-only
security.jwt.expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.app=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Server
server.port=0
