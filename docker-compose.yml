services:
  # PostgreSQL: saas_global (identities) + saas_shard_1 (schema per service), one role per service
  postgres:
    image: postgres:15-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      ORG_DB_PASSWORD: ${ORG_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD}
      OUTBOX_RELAY_DB_PASSWORD: ${OUTBOX_RELAY_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer in transaction pooling mode; services connect here, Flyway connects to postgres directly
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: saas-pgbouncer
    environment:
      AUTH_TYPE: scram-sha-256
      DATABASE_URLS: "postgres://auth_svc:${AUTH_DB_PASSWORD}@postgres/saas_global,postgres://org_svc:${ORG_DB_PASSWORD}@postgres/saas_shard_1,postgres://billing_svc:${BILLING_DB_PASSWORD}@postgres/saas_shard_1,postgres://notif_svc:${NOTIF_DB_PASSWORD}@postgres/saas_shard_1"
    ports:
      - "6432:6432"
    volumes:
      - ./db/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 and PgBouncer listens on IPv4 only
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (KRaft, no Zookeeper). Containers use kafka:29092, the host uses localhost:9092.
  kafka:
    image: apache/kafka:3.9.2
    container_name: saas-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: saas-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: saas-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Port 8080)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: saas-api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - organization-service
      - billing-service
      - notification-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (Port 8081)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: saas-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/saas_global
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: kafka:29092
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Organization Service (Port 8082)
  organization-service:
    build:
      context: ./organization-service
      dockerfile: Dockerfile
    container_name: saas-org-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      ORG_DB_PASSWORD: ${ORG_DB_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/saas_shard_1
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Billing Service (Port 8083)
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: saas-billing-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/saas_shard_1
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Notification Service (Port 8084)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: saas-notif-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/saas_shard_1
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: saas-network
