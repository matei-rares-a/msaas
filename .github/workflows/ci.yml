name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker daemon; failsafe runs *IT / *IntegrationTests.
      - name: mvnw verify
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  traceability:
    name: Traceability (REQ -> tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script self-test
        run: node --test scripts/verify/check-traceability.test.mjs
      - name: README endpoints exist
        run: node --test scripts/verify/readme-endpoints.test.mjs
      - name: Setup scripts (checks, installer dry-runs, versions)
        run: node --test scripts/env/setup.test.mjs scripts/verify/clean-machine.test.mjs
      - name: Check every due REQ has a test
        run: node scripts/verify/check-traceability.mjs

  frontend:
    name: Frontend (build + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: angular_base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: angular_base/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
      # browser tests against a stubbed gateway; they use the Chrome the runner already has
      - run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: angular_base/test-results/

  e2e:
    name: E2E (whole platform on Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script self-test
        run: node --test scripts/infra/e2e-stack.test.mjs scripts/infra/demo-stack.test.mjs
      # builds the jars, starts the stack, runs the tests, stops the stack
      - name: E2E suite
        run: node scripts/infra/e2e-stack.mjs --all
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-tests/target/failsafe-reports/

  installer:
    name: Installer on a bare system (${{ matrix.distro }} ${{ matrix.flags }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: 'ubuntu:22.04', flags: '' }
          - { distro: 'ubuntu:24.04', flags: '' }
          - { distro: 'ubuntu:24.04', flags: '--user' }
          - { distro: 'debian:12', flags: '--user' }
          - { distro: 'fedora:41', flags: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # a container with nothing on it but the system: the installer, again, and --check (the full path is --full, about 20 minutes)
      - name: Installer in a clean container
        run: node scripts/verify/clean-machine.mjs --distro ${{ matrix.distro }} ${{ matrix.flags }}
