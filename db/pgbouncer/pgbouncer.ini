; PgBouncer in front of Postgres (REQ-SCALE-04). Transaction pooling: session state must not outlive a
; transaction, which is why the tenant context is set with SET LOCAL (REQ-DATA-08).
; userlist.txt is generated by the image from DATABASE_URLS.

[databases]
saas_global = host=postgres port=5432 dbname=saas_global
saas_shard_1 = host=postgres port=5432 dbname=saas_shard_1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 200
max_client_conn = 500
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
