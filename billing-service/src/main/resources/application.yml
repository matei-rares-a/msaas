spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/saas_shard_1
    username: ${BILLING_DB_USER:billing_svc}
    password: ${BILLING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # see organization-service's application.yml for why this must be false in tenant-scoped services
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: billing
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cache:
    type: redis

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Tenant-scoped service: tenant_id filter + SET LOCAL app.tenant_id per transaction (P2.2)
saas:
  tenancy:
    enabled: true
  outbox:
    enabled: true
    relay:
      enabled: false
      schema: billing
      poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
      datasource:
        url: ${spring.datasource.url}
        username: ${OUTBOX_RELAY_DB_USER:outbox_relay}
        password: ${OUTBOX_RELAY_DB_PASSWORD}
  billing:
    # Default trial length (P6.3); a configurable default, not a requirement (section 4 of the plan).
    trial-days: 14
    # Plan lookup in the global DB (P6.1): same role/password as the primary datasource, different database.
    global-catalog:
      datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/saas_global
        username: ${BILLING_DB_USER:billing_svc}
        password: ${BILLING_DB_PASSWORD}
    # Cross-tenant "trial subscriptions past their deadline" lookup (P6.3); dedicated BYPASSRLS reader.
    job-reader:
      datasource:
        url: ${spring.datasource.url}
        username: ${BILLING_JOB_READER_DB_USER:billing_job_reader}
        password: ${BILLING_JOB_READER_DB_PASSWORD}
