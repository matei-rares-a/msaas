spring:
  graphql:
    # under /notifications so the gateway's existing route reaches it and nothing else is exposed (REQ-MON-08)
    path: /notifications/graphql
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/saas_shard_1
    username: ${NOTIF_DB_USER:notif_svc}
    password: ${NOTIF_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # see organization-service's application.yml for why this must be false in tenant-scoped services
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notif
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: notif-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Events are raw JSON text (the outbox relay publishes String/String); listeners deserialize themselves.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8084

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Tenant-scoped service: tenant_id filter + SET LOCAL app.tenant_id per transaction (P2.2)
saas:
  tenancy:
    enabled: true
  # Limits on what one journal query may cost (P9.2, REQ-MON-08)
  graphql:
    max-depth: ${GRAPHQL_MAX_DEPTH:6}
    max-complexity: ${GRAPHQL_MAX_COMPLEXITY:1000}
    max-page-size: ${GRAPHQL_MAX_PAGE_SIZE:100}
  # Sending emails (P9.4, REQ-NOTIF-08): a failed delivery is retried max-retries times, waiting initial-backoff, then
  # twice that, and so on; after that the email is recorded FAILED. command-exchanges are the producers' command
  # channels. There is no setting a user can turn emails off with (REQ-NOTIF-09).
  email:
    provider: ${EMAIL_PROVIDER:simulated}
    max-retries: ${EMAIL_MAX_RETRIES:3}
    initial-backoff: ${EMAIL_INITIAL_BACKOFF:PT1S}
    listener-retry-backoff-ms: ${EMAIL_LISTENER_RETRY_BACKOFF_MS:1000}
    command-exchanges: ${EMAIL_COMMAND_EXCHANGES:org.commands,auth.commands,billing.commands}
    app-base-url: ${APP_BASE_URL:http://localhost:4200}
    support-contact: ${EMAIL_SUPPORT_CONTACT:support@example.com}
  # Journal export (P9.3, REQ-MON-05, REQ-SCALE-03): an export whose estimated time (rows x measured cost per row)
  # is over async-threshold runs as a background job; the estimate starts from default-millis-per-row until
  # exports have been measured, then uses the average of the last timing-window runs.
  export:
    async-threshold: ${EXPORT_ASYNC_THRESHOLD:PT5S}
    default-millis-per-row: ${EXPORT_DEFAULT_MILLIS_PER_ROW:0.05}
    timing-window: ${EXPORT_TIMING_WINDOW:20}
    max-rows: ${EXPORT_MAX_ROWS:500000}
    retention: ${EXPORT_RETENTION:PT24H}
  outbox:
    enabled: true
    relay:
      enabled: false
      schema: notif
      poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
      datasource:
        url: ${spring.datasource.url}
        username: ${OUTBOX_RELAY_DB_USER:outbox_relay}
        password: ${OUTBOX_RELAY_DB_PASSWORD}
