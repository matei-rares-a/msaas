<nav class="app-nav" *ngIf="user$ | async as user">
  <img *ngIf="logo$ | async as logo" [src]="logo" alt="Logo" class="app-logo" data-testid="app-logo" />
  <span class="tenant-name" data-testid="tenant-name">{{ user.tenantName }}</span>
  <ng-container *ngIf="permissions$ | async as permissions">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/notifications" routerLinkActive="active" data-testid="nav-notifications">
      Notifications<span class="badge" data-testid="notification-badge" *ngIf="unread$ | async as unread">{{ unread }}</span>
    </a>
    <a *ngIf="permissions.canSeeBilling" routerLink="/billing" routerLinkActive="active" data-testid="nav-billing">Billing</a>
    <a *ngIf="permissions.canSeeBilling" routerLink="/invitations" routerLinkActive="active" data-testid="nav-invitations">Invitations</a>
    <a *ngIf="permissions.canSeeJournal" routerLink="/journal" routerLinkActive="active" data-testid="nav-journal">Journal</a>
    <a *ngIf="permissions.canEditTheme" routerLink="/theme" routerLinkActive="active" data-testid="nav-theme">Theme</a>
    <span class="readonly-badge" *ngIf="permissions.readOnly" data-testid="nav-readonly">read-only</span>
  </ng-container>
</nav>

<div class="container">
  <router-outlet />
</div>
