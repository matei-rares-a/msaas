<div class="home" *ngIf="user$ | async as user">
  <h1>{{ user.tenantName }}</h1>
  <p class="who" data-testid="who">
    {{ user.displayName }} &middot; <span data-testid="role">{{ user.role }}</span>
    <span class="readonly" *ngIf="user.readOnly" data-testid="readonly-flag">read-only</span>
  </p>

  <p class="alert-info" *ngIf="user.readOnly" data-testid="readonly-notice">
    Your access to the data of this organization is read-only: you can look, but not change anything.
  </p>

  <ng-container *ngIf="permissions$ | async as permissions">
    <div class="tiles">
      <a class="tile" routerLink="/notifications" data-testid="tile-notifications">Notifications</a>
      <a class="tile" routerLink="/billing" *ngIf="permissions.canSeeBilling" data-testid="tile-billing">Billing</a>
      <a class="tile" routerLink="/invitations" *ngIf="permissions.canSeeBilling" data-testid="tile-invitations">Invitations</a>
      <a class="tile" routerLink="/journal" *ngIf="permissions.canSeeJournal" data-testid="tile-journal">Activity journal</a>
      <a class="tile" routerLink="/theme" *ngIf="permissions.canEditTheme" data-testid="tile-theme">Theme</a>
    </div>
  </ng-container>

  <button type="button" class="logout" data-testid="logout" (click)="logout()">Log out</button>
</div>
